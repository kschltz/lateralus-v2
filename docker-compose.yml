# lateralus + optional local Ollama
#
# Default path (./scripts/start-workbench): lateralus talks to *host* Ollama
# at host.docker.internal:11434 — no model mount/copy. Compose `ollama` is
# only for machines without a host daemon (or LATERALUS_FORCE_DOCKER_OLLAMA=1).
#
# Workbench: http://localhost:7860  |  Portal iframe: http://localhost:7870

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 12

  pull-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull $${LATERALUS_MODEL:-llama3.2}"]
    profiles: ["setup"]

  lateralus:
    build:
      context: .
      args:
        LATERALUS_SRC_REV: ${LATERALUS_SRC_REV:-dev}
    # Host-Ollama runs use `docker compose run --no-deps` and skip this.
    depends_on:
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LATERALUS_WORKBENCH_HOST: "0.0.0.0"
      LATERALUS_WORKBENCH_PUBLIC_HOST: localhost
      LATERALUS_PORTAL_PORT: "7870"
      LATERALUS_IN_DOCKER: "1"
      LATERALUS_DOCKER_OLLAMA_URL: ${LATERALUS_DOCKER_OLLAMA_URL:-http://ollama:11434/v1}
      LATERALUS_LIST_CLOUD: ${LATERALUS_LIST_CLOUD:-0}
      # StoreEngine choice: unset/memory = built-in defaults; duckdb = one
      # DuckDB file for sessions + stream events + file index (see
      # LATERALUS_STORE_PATH for the file location, default /data/config/lateralus.duckdb).
      LATERALUS_STORE: ${LATERALUS_STORE:-}
      LATERALUS_STORE_PATH: ${LATERALUS_STORE_PATH:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      LATERALUS_API_KEY: ${LATERALUS_API_KEY:-}
      LATERALUS_CONFIG_HOME: /data/config
    volumes:
      - lateralus-config:/data/config
    ports:
      - "7860:7860"
      - "7870:7870"
    stdin_open: true
    tty: true
    command: ["-i"]

volumes:
  ollama-data:
  lateralus-config:
